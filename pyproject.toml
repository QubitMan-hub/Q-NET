[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpvsim"
version = "0.1.0"
description = "QPV Workbench: an event-driven, quantum-capable, adversary-aware simulation workbench for Quantum Position Verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=7", "hypothesis>=6", "httpx>=0.25", "fastapi>=0.110"]

[project.scripts]
qpv = "qpvsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qpvsim = ["examples/*.json", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
