# Build the static workbench (engine runs in the browser via Pyodide) and
# publish it to GitHub Pages.
#
# GitHub only lets the `github-pages` environment deploy from the repository's
# default branch, so the jobs run only there; pushes to any other branch show
# this workflow as skipped rather than failed. Whichever branch is set as the
# default (Settings -> General) is the one that publishes.
name: Deploy workbench to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one queue per branch, so a skipped run on another branch is never cancelled;
# never cancel a deployment that is already running
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: scripts/build_pages.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
